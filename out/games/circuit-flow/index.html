<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Circuit Flow - TeknoGame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060913;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      max-width: 520px;
      margin: 0 auto;
      pointer-events: none;
    }
    .hud-left {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(11, 18, 34, 0.85);
      color: #94a3b8;
      padding: 5px 12px;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 12px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }
    .badge span {
      color: #00f0ff;
    }
    .badge.best span {
      color: #f59e0b;
    }
    .badge.progress span {
      color: #10b981;
    }
    .btn-audio {
      pointer-events: auto;
      background: rgba(11, 18, 34, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
      transition: transform 0.1s;
    }
    .btn-audio:active {
      transform: scale(0.92);
    }
    .btn-audio svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #boardWrapper {
      position: relative;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      display: block;
      background: #0a1122;
      border: 2px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .btn-sub {
      background: rgba(15, 23, 42, 0.8);
      color: #94a3b8;
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 8px 18px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sub:hover {
      color: #00f0ff;
      border-color: #00f0ff;
    }
    .btn-sub:active {
      transform: scale(0.95);
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 19, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .title {
      font-size: 32px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .desc {
      font-size: 14px;
      color: #94a3b8;
      max-width: 320px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .stats-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 24px;
      min-width: 220px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 14px;
      font-weight: 700;
      padding: 4px 0;
    }
    .stats-label {
      color: #64748b;
    }
    .stats-val {
      color: #fff;
    }
    .btn-action {
      background: linear-gradient(135deg, #00f0ff, #3b82f6);
      color: #060913;
      border: none;
      padding: 13px 32px;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.45);
      letter-spacing: 0.5px;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn-action:hover {
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.65);
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="hud">
      <div class="hud-left">
        <div class="badge">LEVEL: <span id="levelVal">1/9</span></div>
        <div class="badge progress">JALUR: <span id="pathVal">0/3</span></div>
        <div class="badge">SKOR: <span id="scoreVal">0</span></div>
        <div class="badge best">REKOR: <span id="highScoreVal">0</span></div>
      </div>
      <button class="btn-audio" id="audioToggle" aria-label="Toggle Suara">
        <svg id="iconSoundOn" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="iconSoundOff" viewBox="0 0 24 24" style="display: none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </div>

    <div id="boardWrapper">
      <canvas id="gameCanvas"></canvas>
      <div class="controls">
        <button class="btn-sub" id="resetBtn">RESET JALUR</button>
        <button class="btn-sub" id="finishBtn">SELESAI MAIN</button>
      </div>
    </div>

    <!-- Start Overlay -->
    <div id="startScreen" class="overlay">
      <div class="title">CIRCUIT FLOW</div>
      <div class="desc">Hubungkan setiap pasang simpul terminal warna yang sama tanpa saling menyilang jalur kabel!</div>
      <div class="stats-card">
        <div class="stats-row">
          <span class="stats-label">REKOR ANDA:</span>
          <span class="stats-val" id="startHighScore">0</span>
        </div>
      </div>
      <button class="btn-action" id="startBtn">MULAI SAMBUNG</button>
    </div>

    <!-- Win / Game Over Overlay -->
    <div id="gameOverScreen" class="overlay" style="display: none;">
      <div class="title" id="endTitle" style="color: #10b981; text-shadow: 0 0 25px rgba(16,185,129,0.7);">SEMUA SIRKUIT AKTIF</div>
      <div class="desc" id="endDesc">Selamat! Seluruh sistem sirkuit telah berhasil dihubungkan dengan sempurna.</div>
      <div class="stats-card">
        <div class="stats-row">
          <span class="stats-label">Skor Akhir:</span>
          <span class="stats-val" id="finalScoreVal" style="color: #00f0ff;">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Rekor Tertinggi:</span>
          <span class="stats-val" id="finalHighScoreVal" style="color: #f59e0b;">0</span>
        </div>
      </div>
      <button class="btn-action" id="restartBtn">MAIN LAGI</button>
    </div>
  </div>

  <script>
    // Audio Synth Web Audio API
    let audioCtx = null;
    let isMuted = localStorage.getItem('teknogames_muted') === 'true';

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, dur, type = 'sine') {
      if (isMuted) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const Sound = {
      step: (n) => playTone(300 + n * 45, 0.05),
      connect: () => {
        playTone(523, 0.08);
        setTimeout(() => playTone(784, 0.14), 60);
      },
      clear: () => playTone(180, 0.12, 'sawtooth'),
      winLevel: () => {
        playTone(523, 0.08);
        setTimeout(() => playTone(659, 0.08), 70);
        setTimeout(() => playTone(1046, 0.2), 140);
      }
    };

    // Toggle Audio UI
    const audioBtn = document.getElementById('audioToggle');
    const iconSoundOn = document.getElementById('iconSoundOn');
    const iconSoundOff = document.getElementById('iconSoundOff');
    function updateAudioUI() {
      if (isMuted) {
        iconSoundOn.style.display = 'none';
        iconSoundOff.style.display = 'block';
      } else {
        iconSoundOn.style.display = 'block';
        iconSoundOff.style.display = 'none';
      }
    }
    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      localStorage.setItem('teknogames_muted', isMuted);
      updateAudioUI();
    });
    updateAudioUI();

    // High Score System
    const HS_KEY = 'teknogames_circuit-flow_highscore';
    let highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10);
    document.getElementById('highScoreVal').innerText = highScore;
    document.getElementById('startHighScore').innerText = highScore;

    // Skema Warna Terminal Sirkuit (Neon Hex)
    const COLOR_PALETTE = [
      { id: 1, name: 'Cyan', hex: '#00f0ff', glow: 'rgba(0, 240, 255, 0.5)' },
      { id: 2, name: 'Amber', hex: '#f59e0b', glow: 'rgba(245, 158, 11, 0.5)' },
      { id: 3, name: 'Rose', hex: '#ef4444', glow: 'rgba(239, 68, 68, 0.5)' },
      { id: 4, name: 'Emerald', hex: '#10b981', glow: 'rgba(16, 185, 129, 0.5)' },
      { id: 5, name: 'Violet', hex: '#8b5cf6', glow: 'rgba(139, 92, 246, 0.5)' }
    ];

    // Data 9 Level Progresif (4x4 -> 5x5 -> 6x6)
    const LEVELS = [
      // Level 1: 4x4 (3 pasang)
      {
        size: 4,
        terminals: [
          { x: 0, y: 0, c: 1 }, { x: 3, y: 0, c: 1 },
          { x: 0, y: 3, c: 2 }, { x: 3, y: 3, c: 2 },
          { x: 1, y: 1, c: 3 }, { x: 2, y: 2, c: 3 }
        ]
      },
      // Level 2: 4x4 (3 pasang)
      {
        size: 4,
        terminals: [
          { x: 0, y: 0, c: 1 }, { x: 2, y: 3, c: 1 },
          { x: 1, y: 0, c: 2 }, { x: 3, y: 1, c: 2 },
          { x: 0, y: 2, c: 3 }, { x: 3, y: 3, c: 3 }
        ]
      },
      // Level 3: 4x4 (3 pasang)
      {
        size: 4,
        terminals: [
          { x: 0, y: 1, c: 1 }, { x: 3, y: 2, c: 1 },
          { x: 1, y: 0, c: 2 }, { x: 2, y: 3, c: 2 },
          { x: 0, y: 3, c: 3 }, { x: 3, y: 0, c: 3 }
        ]
      },
      // Level 4: 5x5 (4 pasang)
      {
        size: 5,
        terminals: [
          { x: 0, y: 0, c: 1 }, { x: 4, y: 0, c: 1 },
          { x: 0, y: 4, c: 2 }, { x: 4, y: 4, c: 2 },
          { x: 1, y: 2, c: 3 }, { x: 3, y: 2, c: 3 },
          { x: 2, y: 1, c: 4 }, { x: 2, y: 3, c: 4 }
        ]
      },
      // Level 5: 5x5 (4 pasang)
      {
        size: 5,
        terminals: [
          { x: 0, y: 0, c: 1 }, { x: 2, y: 2, c: 1 },
          { x: 4, y: 0, c: 2 }, { x: 1, y: 3, c: 2 },
          { x: 0, y: 4, c: 3 }, { x: 4, y: 2, c: 3 },
          { x: 3, y: 4, c: 4 }, { x: 4, y: 4, c: 4 }
        ]
      },
      // Level 6: 5x5 (4 pasang)
      {
        size: 5,
        terminals: [
          { x: 0, y: 1, c: 1 }, { x: 3, y: 0, c: 1 },
          { x: 1, y: 1, c: 2 }, { x: 4, y: 1, c: 2 },
          { x: 0, y: 3, c: 3 }, { x: 3, y: 4, c: 3 },
          { x: 1, y: 3, c: 4 }, { x: 4, y: 3, c: 4 }
        ]
      },
      // Level 7: 6x6 (5 pasang)
      {
        size: 6,
        terminals: [
          { x: 0, y: 0, c: 1 }, { x: 5, y: 0, c: 1 },
          { x: 0, y: 5, c: 2 }, { x: 5, y: 5, c: 2 },
          { x: 1, y: 2, c: 3 }, { x: 4, y: 2, c: 3 },
          { x: 2, y: 1, c: 4 }, { x: 3, y: 4, c: 4 },
          { x: 2, y: 3, c: 5 }, { x: 4, y: 4, c: 5 }
        ]
      },
      // Level 8: 6x6 (5 pasang)
      {
        size: 6,
        terminals: [
          { x: 1, y: 0, c: 1 }, { x: 4, y: 5, c: 1 },
          { x: 0, y: 2, c: 2 }, { x: 5, y: 3, c: 2 },
          { x: 2, y: 1, c: 3 }, { x: 3, y: 4, c: 3 },
          { x: 0, y: 5, c: 4 }, { x: 5, y: 0, c: 4 },
          { x: 2, y: 3, c: 5 }, { x: 4, y: 1, c: 5 }
        ]
      },
      // Level 9: 6x6 (5 pasang)
      {
        size: 6,
        terminals: [
          { x: 0, y: 0, c: 1 }, { x: 3, y: 3, c: 1 },
          { x: 5, y: 0, c: 2 }, { x: 2, y: 2, c: 2 },
          { x: 0, y: 5, c: 3 }, { x: 4, y: 4, c: 3 },
          { x: 5, y: 5, c: 4 }, { x: 1, y: 1, c: 4 },
          { x: 2, y: 4, c: 5 }, { x: 4, y: 2, c: 5 }
        ]
      }
    ];

    let currentLevel = 0;
    let score = 0;
    let currentPath = [];
    let currentDrawingColor = null;
    let paths = {}; // colorId -> Array of {x, y}
    let isDrawing = false;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cellSize = 60;
    let gridSize = 4;

    function resizeCanvas() {
      const maxDim = Math.min(window.innerWidth * 0.88, 380);
      cellSize = Math.floor(maxDim / gridSize);
      canvas.width = cellSize * gridSize;
      canvas.height = cellSize * gridSize;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function initLevel() {
      const lvl = LEVELS[currentLevel];
      gridSize = lvl.size;
      paths = {};
      currentPath = [];
      currentDrawingColor = null;
      isDrawing = false;

      document.getElementById('levelVal').innerText = `${currentLevel + 1}/9`;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('highScoreVal').innerText = highScore;

      updatePathCount();
      resizeCanvas();
    }

    function getUniqueColors() {
      const lvl = LEVELS[currentLevel];
      const colors = new Set();
      lvl.terminals.forEach(t => colors.add(t.c));
      return Array.from(colors);
    }

    function updatePathCount() {
      const uniqueColors = getUniqueColors();
      let connectedCount = 0;

      uniqueColors.forEach(cid => {
        if (isColorConnected(cid)) connectedCount++;
      });

      document.getElementById('pathVal').innerText = `${connectedCount}/${uniqueColors.length}`;
      return connectedCount === uniqueColors.length;
    }

    function isColorConnected(cid) {
      const p = paths[cid];
      if (!p || p.length < 2) return false;
      const lvl = LEVELS[currentLevel];
      const t1 = lvl.terminals.find(t => t.c === cid && t.x === p[0].x && t.y === p[0].y);
      const t2 = lvl.terminals.find(t => t.c === cid && t.x === p[p.length - 1].x && t.y === p[p.length - 1].y);
      return Boolean(t1 && t2 && (p[0].x !== p[p.length - 1].x || p[0].y !== p[p.length - 1].y));
    }

    // Grid Coordinates dari Event Pointer
    function getCellCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const x = Math.floor((clientX - rect.left) / cellSize);
      const y = Math.floor((clientY - rect.top) / cellSize);
      if (x >= 0 && x < gridSize && y >= 0 && y < gridSize) {
        return { x, y };
      }
      return null;
    }

    function getTerminalAt(x, y) {
      const lvl = LEVELS[currentLevel];
      return lvl.terminals.find(t => t.x === x && t.y === y);
    }

    function isCellOccupiedByOther(x, y, exceptColor) {
      for (const [cid, pts] of Object.entries(paths)) {
        if (parseInt(cid, 10) === exceptColor) continue;
        if (pts.some(pt => pt.x === x && pt.y === y)) return true;
      }
      return false;
    }

    // Input Handling
    function onPointerDown(e) {
      initAudio();
      const pos = getCellCoords(e);
      if (!pos) return;

      const term = getTerminalAt(pos.x, pos.y);
      if (term) {
        // Mulai dari terminal
        isDrawing = true;
        currentDrawingColor = term.c;
        paths[term.c] = [{ x: pos.x, y: pos.y }];
        currentPath = paths[term.c];
        Sound.step(1);
        render();
      } else {
        // Cek apakah mengklik jalur yang sudah ada untuk melanjutkan/menghapus
        for (const [cid, pts] of Object.entries(paths)) {
          const idx = pts.findIndex(p => p.x === pos.x && p.y === pos.y);
          if (idx !== -1) {
            isDrawing = true;
            currentDrawingColor = parseInt(cid, 10);
            paths[cid] = pts.slice(0, idx + 1);
            currentPath = paths[cid];
            Sound.step(idx + 1);
            render();
            break;
          }
        }
      }
    }

    function onPointerMove(e) {
      if (!isDrawing || !currentDrawingColor) return;
      const pos = getCellCoords(e);
      if (!pos) return;

      const last = currentPath[currentPath.length - 1];
      if (pos.x === last.x && pos.y === last.y) return;

      // Cek apakah bertetangga orthogonal (hanya atas, bawah, kiri, kanan)
      const dist = Math.abs(pos.x - last.x) + Math.abs(pos.y - last.y);
      if (dist !== 1) return;

      // Cek apakah backtrack (mundur ke titik sebelumnya)
      if (currentPath.length > 1) {
        const prev = currentPath[currentPath.length - 2];
        if (pos.x === prev.x && pos.y === prev.y) {
          currentPath.pop();
          Sound.step(currentPath.length);
          render();
          return;
        }
      }

      // Cek jika menabrak jalur warna lain
      if (isCellOccupiedByOther(pos.x, pos.y, currentDrawingColor)) return;

      // Cek jika menabrak terminal warna lain
      const targetTerm = getTerminalAt(pos.x, pos.y);
      if (targetTerm && targetTerm.c !== currentDrawingColor) return;

      // Cek jika loop ke diri sendiri
      const loopIdx = currentPath.findIndex(p => p.x === pos.x && p.y === pos.y);
      if (loopIdx !== -1) {
        currentPath = currentPath.slice(0, loopIdx + 1);
        paths[currentDrawingColor] = currentPath;
        render();
        return;
      }

      // Tambahkan titik ke jalur
      currentPath.push({ x: pos.x, y: pos.y });
      paths[currentDrawingColor] = currentPath;
      Sound.step(currentPath.length);
      render();

      // Jika menyentuh terminal target yang sama
      if (targetTerm && targetTerm.c === currentDrawingColor) {
        isDrawing = false;
        Sound.connect();
        score += 40;
        document.getElementById('scoreVal').innerText = score;
        const allConnected = updatePathCount();

        if (allConnected) {
          // Level Selesai
          setTimeout(() => {
            Sound.winLevel();
            score += 150;
            if (currentLevel < LEVELS.length - 1) {
              currentLevel++;
              initLevel();
            } else {
              endGame(true);
            }
          }, 350);
        }
      }
    }

    function onPointerUp() {
      if (isDrawing) {
        isDrawing = false;
        updatePathCount();
        render();
      }
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // Render Canvas Loop
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gambar Garis Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 1; i < gridSize; i++) {
        // Vertikal
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, canvas.height);
        ctx.stroke();
        // Horizontal
        ctx.beginPath();
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(canvas.width, i * cellSize);
        ctx.stroke();
      }

      // Gambar Jalur Kabel yang Sudah Digambar
      for (const [cid, pts] of Object.entries(paths)) {
        if (!pts || pts.length < 2) continue;
        const col = COLOR_PALETTE.find(c => c.id === parseInt(cid, 10));
        if (!col) continue;

        ctx.strokeStyle = col.hex;
        ctx.lineWidth = cellSize * 0.32;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = col.glow;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(pts[0].x * cellSize + cellSize / 2, pts[0].y * cellSize + cellSize / 2);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x * cellSize + cellSize / 2, pts[i].y * cellSize + cellSize / 2);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Gambar Simpul Terminal Bulat
      const lvl = LEVELS[currentLevel];
      lvl.terminals.forEach(t => {
        const col = COLOR_PALETTE.find(c => c.id === t.c);
        if (!col) return;

        const cx = t.x * cellSize + cellSize / 2;
        const cy = t.y * cellSize + cellSize / 2;
        const radius = cellSize * 0.35;

        // Pendar Glow Luar
        ctx.shadowColor = col.glow;
        ctx.shadowBlur = 14;

        // Cincin Luar
        ctx.fillStyle = col.hex;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // Inti Dalam
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#060913';
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Titik Pusat Menyala
        ctx.fillStyle = col.hex;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Reset Jalur Level
    document.getElementById('resetBtn').onclick = () => {
      paths = {};
      currentPath = [];
      currentDrawingColor = null;
      isDrawing = false;
      Sound.clear();
      updatePathCount();
      render();
    };

    function startGame() {
      initAudio();
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      currentLevel = 0;
      score = 0;
      initLevel();
    }

    function endGame(isComplete = false) {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(HS_KEY, highScore.toString());
      }

      const endTitle = document.getElementById('endTitle');
      const endDesc = document.getElementById('endDesc');

      if (isComplete) {
        endTitle.innerText = 'SELURUH SIRKUIT AKTIF';
        endTitle.style.color = '#10b981';
        endTitle.style.textShadow = '0 0 25px rgba(16,185,129,0.7)';
        endDesc.innerText = 'Luar biasa! 9 level rangkaian sirkuit berhasil diselesaikan.';
      } else {
        endTitle.innerText = 'PERMAINAN SELESAI';
        endTitle.style.color = '#00f0ff';
        endTitle.style.textShadow = '0 0 25px rgba(0,240,255,0.7)';
        endDesc.innerText = `Anda menyelesaikan tantangan hingga level ${currentLevel + 1}.`;
      }

      document.getElementById('finalScoreVal').innerText = score;
      document.getElementById('finalHighScoreVal').innerText = highScore;
      document.getElementById('highScoreVal').innerText = highScore;
      document.getElementById('gameOverScreen').style.display = 'flex';

      // Kirim event skor ke portal utama
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "GAME_OVER", score: score }, "*");
      }
    }

    document.getElementById('finishBtn').onclick = () => endGame(false);
    document.getElementById('startBtn').onclick = startGame;
    document.getElementById('restartBtn').onclick = startGame;
  </script>
</body>
</html>
